apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-oracle-sla-alerts
  labels:
    app: stellar-price-oracle
    component: aggregator
spec:
  groups:
    - name: stellar-oracle.sla
      interval: 1m
      rules:
        - alert: OracleSourceSlaBreachRateHigh
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is elevated ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has an SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              The SLA threshold is 5 seconds per request.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceSlaBreachRateCritical
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.2
          for: 3m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is critical ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has a critical SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              Immediate investigation required.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceUptimeDegraded
          expr: |
            last_over_time(oracle_source_uptime_percent{source!=""}[10m]) < 95
          for: 10m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source {{ $labels.source }} uptime has dropped below 95%
            description: >
              Source {{ $labels.source }} has an uptime of
              {{ $value }}% over the last 10 minutes.
              Check source health and circuit breaker status.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: HistoryFileIntegrityFailure
          expr: |
            increase(history_file_read_failures_total[15m]) > 0
          for: 1m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: History file for {{ $labels.asset }} could not be read ({{ $labels.reason }})
            description: >
              The history file for {{ $labels.asset }} failed to parse or decrypt with
              reason {{ $labels.reason }}. The file is quarantined under data/quarantine
              and is no longer being appended to; investigate key configuration or
              on-disk corruption.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

        - alert: HistoryFileQuarantined
          expr: |
            increase(history_file_quarantines_total[15m]) > 0
          for: 1m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: History file for {{ $labels.asset }} was quarantined ({{ $labels.reason }})
            description: >
              A history file that failed to parse or decrypt was moved to
              data/quarantine so it could not be overwritten. Historical data for
              {{ $labels.asset }} restarts from the recovered entry.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

        - alert: HistoryFileWriteFailure
          expr: |
            increase(history_file_write_failures_total[15m]) > 0
          for: 1m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: History append failed verification for {{ $labels.asset }}
            description: >
              An append to the history file for {{ $labels.asset }} could not be
              confirmed durable. Check disk space and permissions on the data
              directory.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

        - alert: AuditRetentionFailing
          expr: |
            increase(audit_retention_failures_total[30m]) > 0
          for: 1m
          labels:
            severity: critical
            component: api
          annotations:
            summary: Audit log retention could not run ({{ $labels.reason }})
            description: >
              The audit retention sweep failed with reason {{ $labels.reason }}.
              Audit entries are still being appended, but logs/audit.log is not
              being rotated into logs/audit-archive. Check disk space and
              permissions on the audit log directory.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/audit-log-retention.md

        - alert: AuditLogAppendFailing
          expr: |
            increase(audit_log_appends_total{status="failed"}[15m]) > 0
          for: 1m
          labels:
            severity: critical
            component: api
          annotations:
            summary: Audit log appends are failing
            description: >
              The API could not append to logs/audit.log. Audit evidence is
              being lost for these events; check disk space and permissions.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/audit-log-retention.md

    - name: stellar-oracle.alerts
      interval: 1m
      rules:
        - alert: PriceFeedStale
          expr: |
            time() - oracle_last_price_update_timestamp_seconds > 120
          for: 2m
          labels:
            severity: warning
            component: api
          annotations:
            summary: Price feed stale for {{ $labels.asset }}
            description: 'Last price timestamp for {{ $labels.asset }} is more than 120s old.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

        - alert: PriceDeviation
          expr: |
            rate(stellar_oracle_anomalies_detected_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Price anomaly detected for {{ $labels.asset }}
            description: 'Anomaly detector has flagged {{ $labels.asset }} in the last 5 minutes.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-anomaly.md

        - alert: CircuitBreakerOpen
          expr: |
            circuit_breaker_state{state="open"} == 1
          for: 30s
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Circuit breaker open for {{ $labels.component }}
            description: 'Circuit breaker for {{ $labels.component }} is open; dependent requests are being short-circuited.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/circuit-breaker-open.md
