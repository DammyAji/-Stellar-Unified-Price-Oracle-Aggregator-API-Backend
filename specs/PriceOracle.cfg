\* Bounded model of specs/PriceOracle.tla.
\* Every constant below is part of the checked configuration: changing a bound
\* changes the state space that TLC actually explores, so treat this file as
\* reviewed input to the verification report (see
\* docs/formal-verification/price-oracle-guarantees.md).

SPECIFICATION Spec

CONSTANTS
  Admins = {admin1, admin2}
  Sources = {src1, src2}
  Assets = {asset1, asset2}
  NoAdmin = noadmin
  MaxHistoryLen = 2
  MaxPrice = 2
  MaxTime = 2

\* State predicates: TLC fails if any reachable state violates one of these.
INVARIANT
  PriceNonNegative
  BoundedStorage
  HistoryMonotonicTimestamps
  LatestMatchesHistory
  InitializedHasAdmin

\* Keeps price/timestamp enumeration finite; matches the 0..MaxPrice / 0..MaxTime
\* window used by Next.
CONSTRAINT
  StateConstraint

\* Step properties ([][A]_vars): TLC fails if any step violates one of these.
PROPERTY
  NoLossOfFundsStep
  AccessControlStep
  WriteOnceInitializationStep
  PriceMonotonicityStep
